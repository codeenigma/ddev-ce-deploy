name: ddev-ce-deploy
ddev_version_constraint: ">= v1.24.0"
project_files:
  - "web-build/Dockerfile"
  - "web-build/provision.yml"
  - "ce-deploy.sh"
  - "commands/web/deploy"
  - "commands/host/get-db"
  - "commands/host/lib/get-db-functions.sh"
  - "docker-compose.ce-deploy.yaml"
post_install_actions:
  - |
    <?php
    #ddev-description: Configure ce-deploy and get-db, update permissions
    $projectName = $_ENV['DDEV_PROJECT'];
    $docroot = $_ENV['DDEV_DOCROOT'];
    $projectType = $_ENV['DDEV_PROJECT_TYPE'];

    // Make deploy command executable
    $deployCommandPath = 'commands/web/deploy';
    if (file_exists($deployCommandPath)) {
        chmod($deployCommandPath, 0755);
        echo "Made deploy command executable\n";
    }

    // Make deploy script executable
    $deployScriptPath = 'ce-deploy.sh';
    if (file_exists($deployScriptPath)) {
        chmod($deployScriptPath, 0755);
        echo "Made deploy script executable\n";
    }

    // Make get-db command executable
    $getDbCommandPath = 'commands/host/get-db';
    if (file_exists($getDbCommandPath)) {
        chmod($getDbCommandPath, 0755);
        echo "Made get-db command executable\n";
    }

    // Make get-db functions library executable
    $getDbFunctionsPath = 'commands/host/lib/get-db-functions.sh';
    if (file_exists($getDbFunctionsPath)) {
        chmod($getDbFunctionsPath, 0755);
        echo "Made get-db-functions.sh executable\n";
    }
    ?>
